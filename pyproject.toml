[project]
name = "storyforge3"
version = "0.1.0"
description = "中文网文全流程创作引擎"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "ebooklib>=0.20",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "sse-starlette>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[project.scripts]
storyforge3 = "storyforge3.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp"

[tool.coverage.run]
omit = [
    "src/storyforge3/llm/ccswitch_reader.py",
    "src/storyforge3/llm/protocol.py",
    "src/storyforge3/services/protocols.py",
]
